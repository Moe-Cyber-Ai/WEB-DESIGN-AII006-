<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>form9.html</title>

<style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(to right, #eef2f7, #dfe9f3);
        padding:40px;
        color:#333;
    }

    .container{
        max-width:750px;
        margin:auto;
        background-color:white;
        padding:40px;
        border-radius:14px;
        box-shadow:0 8px 25px rgba(0,0,0,0.12);
    }

    h1{
        text-align:center;
        margin-bottom:35px;
        color:#1f2937;
        font-size:34px;
        letter-spacing:1px;
    }

    form{
        display:flex;
        flex-direction:column;
        gap:25px;
    }

    .form-group{
        display:flex;
        flex-direction:column;
    }

    label{
        margin-bottom:10px;
        font-weight:bold;
        font-size:15px;
        color:#374151;
    }

    input[type="text"],
    input[type="email"],
    textarea,
    select{
        width:100%;
        padding:14px;
        border:1px solid #cbd5e1;
        border-radius:8px;
        font-size:15px;
        transition:0.3s;
        background-color:#f9fafb;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    textarea:focus,
    select:focus{
        outline:none;
        border-color:#2563eb;
        box-shadow:0 0 8px rgba(37,99,235,0.25);
        background-color:white;
    }

    textarea{
        resize:vertical;
    }

    fieldset{
        border:1px solid #d1d5db;
        border-radius:10px;
        padding:22px;
        background-color:#f8fafc;
    }

    legend{
        padding:0 12px;
        font-weight:bold;
        color:#1e3a8a;
        font-size:16px;
    }

    .options{
        display:flex;
        flex-direction:column;
        gap:12px;
        margin-top:10px;
    }

    .options label{
        font-weight:normal;
        display:flex;
        align-items:center;
        gap:10px;
        margin-bottom:0;
        cursor:pointer;
    }

    input[type="checkbox"],
    input[type="radio"]{
        transform:scale(1.1);
        accent-color:#2563eb;
    }

    select{
        cursor:pointer;
    }

    .buttons{
        display:flex;
        justify-content:center;
        gap:20px;
        margin-top:10px;
    }

    input[type="submit"],
    input[type="reset"]{
        padding:14px 35px;
        border:none;
        border-radius:8px;
        font-size:15px;
        font-weight:bold;
        cursor:pointer;
        transition:0.3s;
    }

    input[type="submit"]{
        background-color:#2563eb;
        color:white;
    }

    input[type="submit"]:hover{
        background-color:#1d4ed8;
        transform:translateY(-2px);
    }

    input[type="reset"]{
        background-color:#e5e7eb;
        color:#111827;
    }

    input[type="reset"]:hover{
        background-color:#d1d5db;
        transform:translateY(-2px);
    }

</style>

</head>

<body>

<div class="container">

    <h1>The Music Survey</h1>

    <!-- Server-side processing link configured below -->
    <form action="http://www.uyar.com/teaching/ecc006/2017spring/login.php" method="post">

        <!-- Name -->
        <div class="form-group">
            <label for="name">Name:</label>

            <input 
                type="text" 
                id="name" 
                name="name" 
                placeholder="Enter your full name"
                required>
        </div>

        <!-- Email -->
        <div class="form-group">
            <label for="email">E-Mail Address:</label>

            <input 
                type="email" 
                id="email" 
                name="email" 
                placeholder="example@email.com"
                required>
        </div>

        <!-- Checkbox Group -->
        <fieldset>

            <legend>Select Your Favorite Types of Music</legend>

            <div class="options">

                <label>
                    <input type="checkbox" name="music[]" value="Pop">
                    Pop
                </label>

                <label>
                    <input type="checkbox" name="music[]" value="Classical">
                    Classical
                </label>

                <label>
                    <input type="checkbox" name="music[]" value="Rock">
                    Rock
                </label>

                <label>
                    <input type="checkbox" name="music[]" value="Jazz">
                    Jazz
                </label>

                <label>
                    <input type="checkbox" name="music[]" value="Rap">
                    Rap
                </label>

            </div>

        </fieldset>

        <!-- Radio Buttons -->
        <fieldset>

            <legend>Select how often you purchase Music CDs</legend>

            <div class="options">

                <label>
                    <input type="radio" name="purchase" value="Weekly">
                    Weekly
                </label>

                <label>
                    <input type="radio" name="purchase" value="Few CDs">
                    A few CDs each year
                </label>

                <label>
                    <input type="radio" name="purchase" value="Monthly">
                    Monthly
                </label>

                <label>
                    <input type="radio" name="purchase" value="Never">
                    Never purchase
                </label>

            </div>

        </fieldset>

        <!-- Dropdown Menu -->
        <div class="form-group">

            <label for="location">
                Select the locations you listen to Music:
            </label>

            <select id="location" name="location">

                <option value="">-- Choose a Location --</option>

                <option value="At Home">At Home</option>

                <option value="In The Car">In The Car</option>

                <option value="Anywhere MP3 Player">
                    Anywhere (MP3 Player)
                </option>

                <option value="At Work">At Work</option>

                <option value="At The Gym">At The Gym</option>

            </select>

        </div>

        <!-- Text Area -->
        <div class="form-group">

            <label for="role">
                What role does music play in your life?
            </label>

            <textarea 
                id="role"
                name="role"
                cols="60"
                rows="3"
                placeholder="Write your thoughts here..."></textarea>

        </div>

        <!-- Buttons -->
        <div class="buttons">

            <input type="submit" value="Submit">

            <input type="reset" value="Reset">

        </div>

    </form>

</div>

</body>
</html>
